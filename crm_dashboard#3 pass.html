<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>CRM統合ダッシュボード</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1d2230;--muted:#667085;--line:#e3e4e0;--accent:#1f5fbf;--bad:#c0362c}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--panel:#1c2029;--ink:#e8eaef;--muted:#98a1b3;--line:#2c3240;--accent:#6ea2ff;--bad:#ff7a6e}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;width:min(92vw,360px);display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:18px;font-weight:600}p{margin:0;color:var(--muted);font-size:13px}
input{font:inherit;font-size:16px;letter-spacing:.2em;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:9px 12px;border:0;border-radius:6px;background:var(--ink);color:var(--bg);cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:1.4em;color:var(--bad);font-size:13px}
</style></head>
